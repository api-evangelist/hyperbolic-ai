  description: >-
    Decentralized on-demand GPU compute marketplace renting idle H100, H200, A100, and RTX 4090 capacity
    from third-party suppliers. Pricing starts at $0.50/GPU/hr (RTX 4090), $1.39-$1.49/hr (H100), up to
    $3.20/hr (H100 dedicated). Up to 75% cheaper than AWS/Azure/GCP. Instances deploy in under one minute.
    Reserved clusters and dedicated single-tenant endpoints available. Hyperbolic charges a 10% platform
    fee on rental income. Managed via app.hyperbolic.ai dashboard, the `hyperbolic-cli` Go CLI, the MCP
    server, and the Hyperbolic AgentKit.
